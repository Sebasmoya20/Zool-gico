<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/zoo icono.png ">
    <title>Contacto</title>
</head>
<body>
     <header >
        <h1 style="display: flex; justify-content: center;">Zoológico Simba</h1>
        <p style="display: flex; justify-content: center;">Descubre la maravillosa vida animal</p>
    </header>
    <!--Navegación-->
    <nav>
        <a href="/index.html">Home</a>
        <a href="/pages/galeria.html">Galería</a>
        <a href="">Acerca</a>
        <a href="/pages/contacto.html">Contacto</a>
    </nav>
    <hr>
    <h2 style="text-align: center;">Registro de usuario</h2>
    <form action="#">
        <label for="nombre">Ingrese su nombre:</label>
        <br><br>
        <input type="nombre" id="nombre" placeholder="nombre" size="10" required>
        <br><br>
         <label for="email">Ingrese su email:</label>
        <br><br>
        <input type="email" id="email" placeholder="email">
        <br><br>
         <label for="password">Ingrese su contraseña:</label>
        <br><br>
        <input type="password" id="password" placeholder="password">
        <br><br>
         <label for="fecha_nacimiento">Ingrese su fecha de nacimiento:</label>
        <br><br>
        <input type="date" id="fecha_nacimiento">
        <br><br>
         <label for="telefono">Ingrese su teléfono</label>
        <br><br>
        <input type="tel" id="telefono" placeholder="+593-99-999-9999">
        <br><br>
         <label for="cargas">Cargas familiares</label>
        <br><br>
        <input type="number" id="cargas">
        <br><br>
        <label for="">Género:</label>
        <br><br>
        <label for="masculino"><input type="radio" id="masculino" name="genero">Masculino</label>
        <label for="femenino"><input type="radio" id="femenino" name="genero">Femenino</label>
        <label for="otro"><input type="radio" id="otro" name="genero">Otro</label>
        <br><br>
        <label for="ciudad">Ciudad: </label>
        <select name="ciudad" id="ciudad">
            <option value="seleccionar" disabled selected>Seleccionar</option>
            <option value="quito">Quito</option>
            <option value="latacunga">Latacunga</option>
            <option value="ibarra">Ibarra</option>
            <option value="cuenca">Cuenca</option>
            <option value="otro">Otro</option>
        </select>
        <br><br>
        <label for="comentarios">Ingrese sus comentarios: </label>
        <br><br>
        <textarea name="comentarios" id="comentarios" rows="4" cols="50" placeholder="comentarios"></textarea>
        <br><br>
        <label for="foto">Adjuntar fotografía</label>
        <br><br>
        <input type="file">
        <br><br>
        <!--BOTONES-->
        <button>Botón simple</button>
        <input type="submit" value="Enviar">
        <button type="reset">Limpiar</button>
    </form>
</body>
</html>
